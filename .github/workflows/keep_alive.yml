# .github/workflows/keep_alive.yml
# Pings the Qavi Streamlit app daily to prevent sleep.
# Add secret APP_URL in: GitHub repo → Settings → Secrets and variables → Actions

name: Keep Alive
 
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
 
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Qavi
        run: |
          curl -L --max-time 120 --retry 3 --retry-delay 15 \
               --retry-connrefused --silent --output /dev/null \
               https://qviv04.streamlit.app || true
          echo "Done." /dev/null \
            "$URL" || true
          echo "Ping done."
