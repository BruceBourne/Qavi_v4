# .github/workflows/keep_alive.yml
# Pings the Qavi app every 24 hours to prevent Streamlit Community Cloud
# from sleeping it due to inactivity.
#
# Setup:
#   1. Add this file to your repo at: .github/workflows/keep_alive.yml
#   2. Go to GitHub repo → Settings → Secrets and variables → Actions
#   3. Add a secret named: APP_URL
#      Value: your full Streamlit app URL, e.g. https://qavi.streamlit.app
#   4. That's it. GitHub Actions runs this automatically.

name: Keep Alive

on:
  schedule:
    # Runs every day at 06:00 UTC (11:30 AM IST) — well within free tier limits
    - cron: "0 6 * * *"
  workflow_dispatch:    # also lets you trigger it manually from GitHub Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Qavi app
        run: |
          echo "Pinging ${{ secrets.APP_URL }} to prevent sleep..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 30 \
            --retry 3 \
            --retry-delay 10 \
            "${{ secrets.APP_URL }}")
          echo "HTTP status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "✅ App is awake (HTTP $STATUS)"
          else
            echo "⚠️  Unexpected status $STATUS — app may need manual wake"
            exit 0   # Don't fail the workflow, just warn
          fi
