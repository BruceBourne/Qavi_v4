# .github/workflows/keep_alive.yml
# Pings the Qavi Streamlit app daily to prevent sleep.
# Add secret APP_URL in: GitHub repo → Settings → Secrets and variables → Actions

name: Keep Alive

on:
  schedule:
    - cron: "0 6 * * *"   # daily at 06:00 UTC (11:30 AM IST)
  workflow_dispatch:       # manual trigger from Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping app
        run: |
          URL="${{ secrets.APP_URL }}"
          if [ -z "$URL" ]; then
            echo "APP_URL secret is not set."
            exit 1
          fi
          echo "Pinging: $URL"
          # --max-time 120: Streamlit cold-start can take 60-90s
          # --retry 3: retry up to 3 times if it fails
          # --retry-connrefused: also retry on connection refused (app still waking)
          # --retry-max-time 360: total retry budget of 6 minutes
          # exit 0 at end: never fail the workflow even if app is slow
          curl -L \
            --max-time 120 \
            --retry 3 \
            --retry-delay 15 \
            --retry-connrefused \
            --retry-max-time 360 \
            --silent \
            --output /dev/null \
            "$URL" || true
          echo "Ping done."
